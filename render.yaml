services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. FastAPI Modular Monolith Backend API
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: saas-exit-exam-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        value: https://sbvyjbipchglzmttkowy.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: STORAGE_DRIVER
        value: supabase
      - key: STORAGE_BUCKET
        value: course-packages

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Platform Owner & Super Admin Next.js Web Dashboard
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: saas-exit-exam-web
    env: node
    region: frankfurt
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: https://saas-learning-exit-exam-platform.onrender.com/api/v1
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://sbvyjbipchglzmttkowy.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
